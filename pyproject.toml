[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aling-notion-mcp"
version = "0.1.0"
description = "Private, compact Notion MCP server for diary and memory workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
aling-notion-mcp = "notion_mcp.server:main"

[tool.setuptools.packages.find]
include = ["notion_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
